spring.application.name=connectly-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/connectly_db
spring.datasource.username=${DB_USERNAME:connectly_user}
spring.datasource.password=${DB_PASSWORD:connectly_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=900

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
